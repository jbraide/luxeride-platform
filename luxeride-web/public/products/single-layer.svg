<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1916"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>

  <!-- reticle corners, matching the app's laser-measured motif -->
  <g stroke="#D4AF37" stroke-width="2.5" opacity="0.8">
    <path d="M28 20 H50 M28 20 V42" fill="none"/>
    <path d="M452 20 H430 M452 20 V42" fill="none"/>
    <path d="M28 340 H50 M28 340 V318" fill="none"/>
    <path d="M452 340 H430 M452 340 V318" fill="none"/>
  </g>

  <!-- single mat outline -->
  <path d="M170 130 L310 130 L340 250 Q340 262 328 262 L152 262 Q140 262 140 250 Z"
        fill="none" stroke="#D4AF37" stroke-width="3" stroke-linejoin="round"/>
  <path d="M186 150 L294 150 L316 240 L164 240 Z"
        fill="none" stroke="#8C7853" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="240" y="200" text-anchor="middle" fill="#8C7853" font-family="monospace" font-size="11" letter-spacing="1">1 LAYER</text>

  <text x="240" y="300" text-anchor="middle" fill="#FFFFFF" font-family="'Oswald',sans-serif" font-size="22" font-weight="600" letter-spacing="1">SINGLE LAYER TPE</text>
  <text x="240" y="320" text-anchor="middle" fill="#8C7853" font-family="monospace" font-size="11" letter-spacing="1">LASER-MEASURED FIT</text>

  <!-- unmissable placeholder watermark -->
  <g>
    <rect x="-40" y="28" width="220" height="26" fill="#FF6B35" transform="rotate(-32 70 40)"/>
    <text x="70" y="46" text-anchor="middle" fill="#0A0A0A" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1" transform="rotate(-32 70 40)">PLACEHOLDER</text>
  </g>
</svg>
